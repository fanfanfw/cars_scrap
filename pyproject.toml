[build-system]
requires = ["hatchling>=1.24.2"]
build-backend = "hatchling.build"

[project]
name = "cars-scrap"
version = "0.1.0"
description = "Cars scraping services (mudah.my, carlist, mobil123, carmudi & olx) using Botasaurus"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.13.4",
  "botasaurus>=0.11.0",
  "flask>=3.1.1",
  "psycopg2-binary>=2.9.10",
  "python-dotenv>=1.1.0",
  "requests>=2.32.3",
]

[project.scripts]
scrape-mudahmy = "scrap_mudahmy_cars_botasaurus.run_scraper:main"
scrape-carlist = "scrap_carlist_cars_botasaurus.run_scraper:main"
scrape-mobil123 = "scrap_mobil123_cars_botasaurus.run_scraper:main"
scrape-carmudi = "scrap_carmudi_cars_botasaurus.run_scraper:main"
scrape-carsomeid = "scrap_carsomeid_cars_botasaurus.run_scraper:main"
scrape-olx = "scrap_olx_cars_botasaurus.run_scraper:main"
migrate-sql = "cars_scrap_common.migrate_sql:main"
serve-mudahmy = "scrap_mudahmy_cars_botasaurus.app:main"
serve-carlist = "scrap_carlist_cars_botasaurus.app:main"
serve-mobil123 = "scrap_mobil123_cars_botasaurus.app:main"
serve-carmudi = "scrap_carmudi_cars_botasaurus.app:main"
serve-carsomeid = "scrap_carsomeid_cars_botasaurus.app:main"
serve-olx = "scrap_olx_cars_botasaurus.app:main"

[tool.hatch.build.targets.wheel]
packages = [
  "cars_scrap_common",
  "scrap_mudahmy_cars_botasaurus",
  "scrap_carlist_cars_botasaurus",
  "scrap_mobil123_cars_botasaurus",
  "scrap_carmudi_cars_botasaurus",
  "scrap_carsomeid_cars_botasaurus",
  "scrap_olx_cars_botasaurus",
]
